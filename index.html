<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- [카카오톡/문자 링크 공유 시 나타나는 미리보기 문구] -->
    <title>오투스세무법인_부가세신고접수</title>
    <meta property="og:title" content="오투스세무법인_부가세신고접수">
    <meta property="og:description" content="2기확정 부가세신고 의뢰하실경우 아래 링크에서 상호를 입력해주세요.">
    <meta property="og:type" content="website">
    <meta name="description" content="2기확정 부가세신고 의뢰하실경우 아래 링크에서 상호를 입력해주세요.">

    <!-- 라이브러리 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        .loading-spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 3px solid #2563eb;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-active:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-x-hidden">
    <div id="root">
        <div class="h-screen flex flex-col items-center justify-center p-6 text-center">
            <div class="loading-spinner mb-4"></div>
            <p class="text-slate-500 font-medium italic">오투스 보안 서버에 연결 중...</p>
        </div>
    </div>

    <!-- Firebase 가동 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // ========================================================
        // ★ [중요] 여기에 Firebase 콘솔에서 복사한 키값을 입력하세요 ★
        // ========================================================
        const manualConfig = {
             apiKey: "AIzaSyCmqVgpC-ImcKIUMnXmk1USeGuitsD-Z5A",
  authDomain: "vattax0001.firebaseapp.com",
  projectId: "vattax0001",
  storageBucket: "vattax0001.firebasestorage.app",
  messagingSenderId: "859698771802",
  appId: "1:859698771802:web:d5a1a9b2f448e80c2ae563",              
        };
        // ========================================================

        const initFirebase = async () => {
            try {
                let config = null;
                if (manualConfig && manualConfig.apiKey) {
                    config = manualConfig;
                } else if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    config = JSON.parse(__firebase_config);
                }

                if (!config || !config.apiKey) {
                    window.FB_ERROR = "Firebase 설정 정보(API Key)가 비어 있습니다. manualConfig 부분을 다시 확인해 주세요.";
                    window.dispatchEvent(new Event('firebase-error'));
                    return;
                }

                const app = initializeApp(config);
                const auth = getAuth(app);
                const db = getFirestore(app);
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'vat-filing-manager';
                const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

                window.FB = { 
                    db, auth, appId, initialToken,
                    collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, setDoc, getDoc, serverTimestamp, 
                    signInAnonymously, signInWithCustomToken, onAuthStateChanged 
                };
                
                window.FB_READY = true;
                window.dispatchEvent(new Event('firebase-ready'));
            } catch (e) {
                window.FB_ERROR = e.message;
                window.dispatchEvent(new Event('firebase-error'));
            }
        };

        initFirebase();
    </script>

    <!-- React 화면 로직 -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const ADMIN_PASSCODE = "otus1234"; 

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                building: <path d="M3 21h18M3 7v1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7M4 17h16V7H4v10Z" />,
                settings: <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z" />,
                send: <path d="m22 2-7 20-4-9-9-4Z" />,
                check: <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />,
                users: <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />,
                trash: <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />,
                lock: <path d="M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4" />,
                search: <React.Fragment><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></React.Fragment>,
                alert: <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4m0 4h.01" />
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        };

        const App = () => {
            const [fbReady, setFbReady] = useState(!!window.FB_READY);
            const [error, setError] = useState(window.FB_ERROR || null);
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
            const [passcode, setPasscode] = useState('');
            
            const [businessName, setBusinessName] = useState('');
            const [repName, setRepName] = useState('');
            const [requests, setRequests] = useState([]);
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [currentPeriod, setCurrentPeriod] = useState('2026년 2기 확정');
            const [tempPeriod, setTempPeriod] = useState('2026년 2기 확정');
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const [timer, setTimer] = useState(0);
            
            // 중복 접수 방지를 위한 에러 상태
            const [duplicateError, setDuplicateError] = useState(false);

            useEffect(() => {
                const interval = setInterval(() => {
                    setTimer(prev => prev + 1);
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                const handleReady = () => setFbReady(true);
                const handleError = () => setError(window.FB_ERROR || "연결 실패");
                window.addEventListener('firebase-ready', handleReady);
                window.addEventListener('firebase-error', handleError);
                if (window.FB_READY) setFbReady(true);
                if (window.FB_ERROR) setError(window.FB_ERROR);
                return () => {
                    window.removeEventListener('firebase-ready', handleReady);
                    window.removeEventListener('firebase-error', handleError);
                };
            }, []);

            useEffect(() => {
                if (!fbReady || error) return;
                const auth = window.FB.auth;
                const unsubscribeAuth = window.FB.onAuthStateChanged(auth, (u) => {
                    if (u) {
                        setUser(u);
                        setLoading(false);
                    }
                });
                const runAuth = async () => {
                    try {
                        if (window.FB.initialToken) {
                            await window.FB.signInWithCustomToken(auth, window.FB.initialToken);
                        } else {
                            await window.FB.signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.error("Auth process error:", e);
                        setError("보안 인증에 실패했습니다: " + e.message);
                        setLoading(false);
                    }
                };
                runAuth();
                return () => unsubscribeAuth();
            }, [fbReady, error]);

            useEffect(() => {
                if (!user || error) return;
                const db = window.FB.db;
                const appId = window.FB.appId;

                window.FB.getDoc(window.FB.doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config')).then(snap => {
                    if (snap.exists()) {
                        const val = snap.data().activePeriod;
                        setCurrentPeriod(val);
                        setTempPeriod(val);
                    }
                }).catch(e => console.warn("Init setting failed:", e));

                const q = window.FB.collection(db, 'artifacts', appId, 'public', 'data', 'filing_requests');
                const unsub = window.FB.onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setRequests(data.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
                }, (err) => {
                    if (err.code === 'permission-denied') {
                        setError("데이터베이스 접근 권한이 없습니다. Firebase 콘솔에서 규칙(Rules)을 확인해 주세요.");
                    }
                });
                return () => unsub();
            }, [user, error]);

            const filteredRequests = useMemo(() => {
                return requests.filter(req => {
                    const isPeriod = req.filingPeriod === currentPeriod;
                    const isSearch = searchTerm === '' || 
                        String(req.businessName).toLowerCase().includes(searchTerm.toLowerCase()) ||
                        String(req.repName).toLowerCase().includes(searchTerm.toLowerCase());
                    return isPeriod && isSearch;
                });
            }, [requests, currentPeriod, searchTerm]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setDuplicateError(false); // 접수 시도 시 에러 초기화

                const bName = businessName.trim();
                const rName = repName.trim();
                if(!bName || !rName) return;

                // [강화된 중복 체크 로직] - 공백 제거 후 비교
                const cleanBName = bName.replace(/\s/g, '');
                const cleanRName = rName.replace(/\s/g, '');

                const isDuplicate = requests.some(r => {
                    const storedBName = (r.businessName || "").trim().replace(/\s/g, '');
                    const storedRName = (r.repName || "").trim().replace(/\s/g, '');
                    return storedBName === cleanBName && storedRName === cleanRName && r.filingPeriod === currentPeriod;
                });

                if (isDuplicate) {
                    setDuplicateError(true);
                    return;
                }

                try {
                    await window.FB.addDoc(window.FB.collection(window.FB.db, 'artifacts', window.FB.appId, 'public', 'data', 'filing_requests'), {
                        businessName: bName, 
                        repName: rName, 
                        filingPeriod: String(currentPeriod), 
                        status: 'pending', 
                        createdAt: window.FB.serverTimestamp(), 
                        userId: user.uid
                    });
                    setIsSubmitted(true);
                } catch(e) { 
                    alert("제출 중 서버 오류가 발생했습니다. 잠시 후 다시 시도해 주세요."); 
                }
            };

            if (error) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-8 text-center bg-white">
                        <div className="text-red-500 bg-red-50 p-6 rounded-full mb-6 animate-pulse"><Icon name="alert" className="w-12 h-12" /></div>
                        <h2 className="text-xl font-bold text-slate-800">서버 연결 오류 발생</h2>
                        <div className="mt-4 p-4 bg-slate-50 rounded-2xl text-slate-500 text-sm max-w-md whitespace-pre-wrap border border-slate-100">
                            {error}
                        </div>
                        <button onClick={() => window.location.reload()} className="mt-8 px-8 py-3 bg-blue-600 text-white rounded-xl font-bold shadow-lg">새로고침하여 다시 시도</button>
                    </div>
                );
            }

            if (loading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-8 text-center bg-slate-50">
                        <div className="loading-spinner mb-4"></div>
                        <h2 className="text-lg font-bold text-slate-800">보안 서버 연결 중...</h2>
                        <p className="text-slate-400 text-sm italic mt-1">인증 처리를 완료하고 있습니다.</p>
                        {timer > 8 && (
                            <div className="mt-12 p-6 bg-white rounded-3xl shadow-sm border border-slate-200 max-w-sm animate-in fade-in">
                                <h3 className="font-bold text-slate-800 flex items-center justify-center gap-2 mb-3">연결이 지연되고 있습니다</h3>
                                <p className="text-xs text-slate-500 leading-relaxed text-left">익명 로그인 활성화 여부와 Firebase 키값을 다시 한번 확인해 주세요.</p>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    <nav className="bg-white border-b px-5 py-4 flex justify-between items-center shadow-sm sticky top-0 z-30">
                        <div className="flex flex-col">
                            <div className="flex items-center gap-2">
                                <div className="bg-blue-600 p-1 rounded-md text-white"><Icon name="building" className="w-4 h-4" /></div>
                                <h1 className="text-lg font-bold text-slate-800 tracking-tight">오투스세무법인_부가세신고접수</h1>
                            </div>
                            {!isAdmin && <p className="text-[10px] text-slate-500 mt-1 font-medium ml-7 leading-tight">2기확정 부가세신고 의뢰하실경우 아래 링크에서 상호를 입력해주세요.</p>}
                        </div>
                        <button onClick={() => isAdmin ? setIsAdmin(false) : setIsAuthModalOpen(true)} className="text-[10px] text-slate-400 font-bold px-2 py-1 border rounded-md">
                            {isAdmin ? '고객모드' : 'Admin'}
                        </button>
                    </nav>

                    <main className="flex-1 flex flex-col items-center p-5 relative overflow-y-auto">
                        {isAuthModalOpen && (
                            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-6">
                                <div className="bg-white w-full max-w-xs rounded-3xl p-8 shadow-2xl space-y-6">
                                    <div className="text-center space-y-2">
                                        <div className="bg-blue-50 w-12 h-12 rounded-full flex items-center justify-center mx-auto text-blue-600"><Icon name="lock" /></div>
                                        <h3 className="text-lg font-bold">관리자 인증</h3>
                                    </div>
                                    <form onSubmit={(e) => { e.preventDefault(); if(passcode === ADMIN_PASSCODE){ setIsAdmin(true); setIsAuthModalOpen(false); setPasscode(''); } else alert("비밀번호 불일치"); }} className="space-y-4">
                                        <input type="password" autoFocus value={passcode} onChange={e => setPasscode(e.target.value)} className="w-full p-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500 text-center text-xl tracking-widest outline-none" placeholder="••••" />
                                        <div className="flex gap-2">
                                            <button type="button" onClick={() => setIsAuthModalOpen(false)} className="flex-1 py-3 text-sm font-bold text-slate-400">취소</button>
                                            <button type="submit" className="flex-1 bg-blue-600 text-white py-3 rounded-xl text-sm font-bold">확인</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {!isAdmin ? (
                            <div className="w-full max-w-md mt-4 animate-in fade-in slide-in-from-bottom-4">
                                {!isSubmitted ? (
                                    <div className="bg-white rounded-3xl shadow-xl shadow-blue-900/5 border border-slate-100 overflow-hidden">
                                        <div className="bg-blue-600 px-8 py-10 text-white text-center">
                                            <h2 className="text-2xl font-bold mb-1">신고대리 접수</h2>
                                            <div className="inline-block bg-white/20 px-4 py-1 rounded-full text-sm font-bold border border-white/30">{currentPeriod} 진행 중</div>
                                        </div>
                                        <form onSubmit={handleSubmit} className="p-8 space-y-6">
                                            <div className="space-y-2">
                                                <label className="text-sm font-bold text-slate-700 ml-1">상호 (사업장명)</label>
                                                <input type="text" required value={businessName} onChange={e => { setBusinessName(e.target.value); setDuplicateError(false); }} className="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-blue-500 focus:bg-white outline-none transition-all text-lg font-medium" placeholder="예: 오투스모텔" />
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-sm font-bold text-slate-700 ml-1">대표자 성함</label>
                                                <input type="text" required value={repName} onChange={e => { setRepName(e.target.value); setDuplicateError(false); }} className="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-blue-500 focus:bg-white outline-none transition-all text-lg font-medium" placeholder="예: 홍길동" />
                                            </div>
                                            
                                            {/* [핵심] 중복 접수 안내 메시지 UI */}
                                            {duplicateError && (
                                                <div className="p-4 bg-red-50 border border-red-100 rounded-2xl flex items-start gap-3 animate-in fade-in slide-in-from-top-1">
                                                    <div className="text-red-500 mt-0.5"><Icon name="alert" className="w-5 h-5" /></div>
                                                    <div className="space-y-1">
                                                        <p className="text-red-800 text-sm font-bold">이미 접수되었습니다.</p>
                                                        <p className="text-red-600 text-xs leading-relaxed">입력하신 상호와 성함으로 이미 접수된 내역이 존재합니다. 담당자가 확인 후 연락드릴 예정입니다.</p>
                                                    </div>
                                                </div>
                                            )}

                                            <button type="submit" className={`w-full bg-blue-600 text-white font-bold py-5 rounded-2xl shadow-lg shadow-blue-200 text-lg transition-all ${duplicateError ? 'opacity-50 cursor-not-allowed' : 'btn-active'}`} disabled={duplicateError}>
                                                {duplicateError ? '이미 접수되었습니다' : '접수 완료하기'}
                                            </button>
                                            <p className="text-[11px] text-slate-400 text-center leading-relaxed">정보가 정확하지 않을 경우 업무 처리에 지연이 발생할 수 있습니다.<br/>문의: 010-9124-5952 (오투스세무법인)</p>
                                        </form>
                                    </div>
                                ) : (
                                    <div className="bg-white p-12 rounded-[2.5rem] shadow-2xl text-center space-y-6 animate-in zoom-in-95">
                                        <div className="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center mx-auto text-green-500"><Icon name="check" className="w-10 h-10" /></div>
                                        <h2 className="text-2xl font-bold">정상 접수되었습니다!</h2>
                                        <p className="text-slate-500 text-sm">감사합니다. 담당자가 기재하신 연락처로 개별 안내드리겠습니다.</p>
                                        <button onClick={() => { setIsSubmitted(false); setBusinessName(''); setRepName(''); setDuplicateError(false); }} className="w-full py-4 bg-slate-100 rounded-2xl font-bold text-slate-600">확인</button>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="w-full max-w-4xl space-y-6 animate-in fade-in">
                                <div className="grid md:grid-cols-2 gap-4">
                                    <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2"><Icon name="settings" /> 신고 기간 설정</h3>
                                        <div className="flex gap-2">
                                            <input type="text" value={tempPeriod} onChange={e => setTempPeriod(e.target.value)} className="flex-1 p-3 rounded-xl bg-slate-50 border outline-none text-sm font-bold" />
                                            <button onClick={async () => {
                                                await window.FB.setDoc(window.FB.doc(window.FB.db, 'artifacts', window.FB.appId, 'public', 'data', 'settings', 'config'), { activePeriod: String(tempPeriod) }, { merge: true });
                                                setCurrentPeriod(tempPeriod); alert("저장되었습니다.");
                                            }} className="bg-blue-600 text-white px-5 py-3 rounded-xl font-bold text-sm">저장</button>
                                        </div>
                                    </div>
                                    <div className="bg-indigo-600 p-6 rounded-3xl text-white shadow-lg flex flex-col justify-center relative overflow-hidden">
                                        <h3 className="font-bold flex items-center gap-2 text-sm z-10"><Icon name="send" /> 문자 발송 가이드</h3>
                                        <p className="text-[10px] opacity-90 mt-2 bg-white/10 p-3 rounded-xl leading-relaxed select-all">
                                            [오투스세무법인] {currentPeriod} 부가세 신고 안내. 아래 링크에서 상호를 입력해 주세요.
                                        </p>
                                    </div>
                                </div>

                                <div className="bg-white p-5 rounded-[2rem] border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                                    <h2 className="text-lg font-bold flex items-center gap-2"><Icon name="users" className="text-blue-600" /> {currentPeriod} 접수 현황 <span className="text-blue-600 bg-blue-50 px-2 py-0.5 rounded-lg text-xs">{filteredRequests.length}건</span></h2>
                                    <div className="relative w-full md:w-64">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><Icon name="search" className="w-4 h-4" /></div>
                                        <input type="text" placeholder="상호/대표자 검색" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full pl-9 pr-3 py-2 bg-slate-50 border-none rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-100" />
                                    </div>
                                </div>

                                <div className="bg-white rounded-[2rem] border border-slate-200 overflow-hidden shadow-sm overflow-x-auto">
                                    <table className="w-full text-left min-w-[500px]">
                                        <thead className="bg-slate-50 border-b text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                                            <tr>
                                                <th className="px-6 py-5">상호</th><th className="px-6 py-5">대표자</th><th className="px-6 py-5 text-center">상태</th><th className="px-6 py-5 text-right">삭제</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50">
                                            {filteredRequests.map(req => (
                                                <tr key={req.id} className="hover:bg-slate-50/50 transition-colors group">
                                                    <td className="px-6 py-5 font-bold text-slate-900 text-sm">{req.businessName}</td>
                                                    <td className="px-6 py-5 text-sm text-slate-600">{req.repName}</td>
                                                    <td className="px-6 py-5 text-center">
                                                        <button onClick={async () => await window.FB.updateDoc(window.FB.doc(window.FB.db, 'artifacts', window.FB.appId, 'public', 'data', 'filing_requests', req.id), { status: req.status === 'pending' ? 'confirmed' : 'pending' })} 
                                                        className={`px-3 py-1 rounded-full text-[10px] font-bold border ${req.status === 'confirmed' ? 'bg-green-50 text-green-700 border-green-100' : 'bg-amber-50 text-amber-700 border-amber-100'}`}>
                                                            {req.status === 'confirmed' ? '완료' : '대기'}
                                                        </button>
                                                    </td>
                                                    <td className="px-6 py-5 text-right">
                                                        <button onClick={async () => { if(confirm('삭제하시겠습니까?')) await window.FB.deleteDoc(window.FB.doc(window.FB.db, 'artifacts', window.FB.appId, 'public', 'data', 'filing_requests', req.id)); }} className="text-slate-200 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-2"><Icon name="trash" className="w-4 h-4" /></button>
                                                    </td>
                                                </tr>
                                            ))}
                                            {filteredRequests.length === 0 && <tr><td colSpan="4" className="px-6 py-20 text-center text-slate-300 text-xs italic">내역이 없습니다.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="py-8 text-center text-slate-300 text-[10px]">© 2026 오투스세무법인_부가세신고접수 All rights reserved.</footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
